[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olfactory-space-explorer-backend"
version = "1.0.0"
description = "Olfactory Space Explorer — neuroscience-inspired odor-embedding research prototype (synthetic demo)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
chem = ["rdkit>=2023.9"]
umap = ["umap-learn>=0.5"]
export = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
